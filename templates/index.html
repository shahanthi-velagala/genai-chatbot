
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Assistant</title>

    <!-- ICONS -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- MARKDOWN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            height:100vh;

            background:
            radial-gradient(circle at top left,#1e1b4b,#0f172a 45%),
            radial-gradient(circle at bottom right,#312e81,#020617 50%);

            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            padding:20px;
        }

        .chat-container{

            width:100%;
            max-width:950px;
            height:92vh;

            backdrop-filter:blur(18px);

            background:rgba(15,23,42,0.72);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:28px;

            overflow:hidden;

            display:flex;
            flex-direction:column;

            box-shadow:
            0 10px 40px rgba(0,0,0,0.4),
            inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        /* HEADER */

        .chat-header{

            height:85px;

            padding:20px 28px;

            border-bottom:1px solid rgba(255,255,255,0.06);

            display:flex;
            justify-content:space-between;
            align-items:center;

            background:rgba(255,255,255,0.02);
        }

        .header-left{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .logo{

            width:50px;
            height:50px;

            border-radius:16px;

            background:linear-gradient(135deg,#8b5cf6,#2563eb);

            display:flex;
            justify-content:center;
            align-items:center;

            color:white;

            box-shadow:0 0 25px rgba(139,92,246,0.5);
        }

        .header-text h1{
            color:white;
            font-size:1.2rem;
            font-weight:700;
        }

        .header-text p{
            color:#94a3b8;
            font-size:0.82rem;
            margin-top:2px;
        }

        .status{
            display:flex;
            align-items:center;
            gap:8px;
            color:#10b981;
            font-size:0.85rem;
        }

        .status-dot{
            width:10px;
            height:10px;
            background:#10b981;
            border-radius:50%;
            box-shadow:0 0 10px #10b981;
        }

        /* CHAT AREA */

        .chat-window{
            flex:1;
            overflow-y:auto;
            padding:30px;
            display:flex;
            flex-direction:column;
            gap:24px;
            scroll-behavior:smooth;
        }

        .chat-window::-webkit-scrollbar{
            width:6px;
        }

        .chat-window::-webkit-scrollbar-thumb{
            background:#334155;
            border-radius:20px;
        }

        /* MESSAGE */

        .message-wrapper{
            display:flex;
            gap:12px;
            animation:fadeUp 0.3s ease;
        }

        .message-wrapper.user{
            justify-content:flex-end;
        }

        .avatar{
            width:42px;
            height:42px;
            border-radius:50%;
            flex-shrink:0;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .bot-avatar{
            background:linear-gradient(135deg,#8b5cf6,#2563eb);
            color:white;
        }

        .user-avatar{
            background:#334155;
            color:white;
        }

        .message-content{
            max-width:75%;
            display:flex;
            flex-direction:column;
            gap:6px;
        }

        .message{

            padding:16px 18px;

            border-radius:20px;

            line-height:1.8;

            font-size:0.96rem;

            word-wrap:break-word;
        }

        .bot-message{

            background:#1e293b;

            color:#f8fafc;

            border-bottom-left-radius:5px;

            border:1px solid rgba(255,255,255,0.04);
        }

        .user-message{

            background:linear-gradient(135deg,#2563eb,#7c3aed);

            color:white;

            border-bottom-right-radius:5px;
        }

        .timestamp{
            font-size:0.72rem;
            color:#94a3b8;
            padding-left:5px;
        }

        /* CHATGPT STYLE MARKDOWN */

        .bot-message h1{
            font-size:1.8rem;
            margin-top:10px;
            margin-bottom:18px;
            color:#ffffff;
            font-weight:700;
        }

        .bot-message h2{
            font-size:1.45rem;
            margin-top:20px;
            margin-bottom:14px;
            color:#c4b5fd;
            font-weight:700;
        }

        .bot-message h3{
            font-size:1.2rem;
            margin-top:18px;
            margin-bottom:12px;
            color:#ddd6fe;
            font-weight:600;
        }

        .bot-message h4{
            font-size:1rem;
            margin-top:15px;
            margin-bottom:10px;
            color:#e9d5ff;
            font-weight:600;
        }

        .bot-message p{
            margin-bottom:14px;
            line-height:1.9;
            color:#e2e8f0;
        }

        .bot-message ul,
        .bot-message ol{
            margin-left:24px;
            margin-top:12px;
            margin-bottom:18px;
        }

        .bot-message li{
            margin-bottom:10px;
            line-height:1.8;
            color:#e2e8f0;
        }

        .bot-message strong{
            color:#ffffff;
            font-weight:700;
        }

        .bot-message em{
            color:#cbd5e1;
            font-style:italic;
        }

        .bot-message code{
            background:#0f172a;
            color:#93c5fd;
            padding:3px 7px;
            border-radius:6px;
            font-size:0.9rem;
        }

        .bot-message pre{
            background:#020617;
            padding:18px;
            border-radius:14px;
            overflow-x:auto;
            margin-top:15px;
            margin-bottom:18px;
            border:1px solid rgba(255,255,255,0.05);
        }

        .bot-message pre code{
            background:none;
            padding:0;
            color:#e2e8f0;
        }

        .bot-message blockquote{
            border-left:4px solid #8b5cf6;
            padding-left:15px;
            margin:15px 0;
            color:#cbd5e1;
        }

        .bot-message a{
            color:#93c5fd;
            text-decoration:none;
        }

        .bot-message a:hover{
            text-decoration:underline;
        }

        /* INPUT */

        .chat-input-area{
            padding:22px;
            border-top:1px solid rgba(255,255,255,0.06);
            background:rgba(255,255,255,0.02);
        }

        .input-container{

            display:flex;
            align-items:center;
            gap:14px;

            background:#0f172a;

            border:1px solid rgba(255,255,255,0.08);

            padding:12px;

            border-radius:20px;
        }

        .input-container:focus-within{
            border-color:#8b5cf6;
            box-shadow:0 0 20px rgba(139,92,246,0.25);
        }

        #userInput{

            flex:1;

            background:transparent;

            border:none;

            outline:none;

            color:white;

            font-size:0.95rem;
        }

        #userInput::placeholder{
            color:#94a3b8;
        }

        .send-btn{

            width:48px;
            height:48px;

            border:none;

            border-radius:15px;

            background:linear-gradient(135deg,#2563eb,#8b5cf6);

            color:white;

            cursor:pointer;

            display:flex;
            justify-content:center;
            align-items:center;

            transition:0.3s;
        }

        .send-btn:hover{
            transform:scale(1.05);
            box-shadow:0 0 18px rgba(139,92,246,0.5);
        }

        /* TYPING */

        .typing{
            display:none;
            align-items:center;
            gap:10px;
            color:#cbd5e1;
            padding-left:10px;
            font-size:0.9rem;
        }

        .dots{
            display:flex;
            gap:4px;
        }

        .dots span{
            width:8px;
            height:8px;
            background:#8b5cf6;
            border-radius:50%;
            animation:bounce 1.2s infinite;
        }

        .dots span:nth-child(2){
            animation-delay:0.2s;
        }

        .dots span:nth-child(3){
            animation-delay:0.4s;
        }

        @keyframes bounce{
            0%,80%,100%{
                transform:scale(0.7);
                opacity:0.5;
            }
            40%{
                transform:scale(1);
                opacity:1;
            }
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(10px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* MOBILE */

        @media(max-width:768px){

            .chat-container{
                height:100vh;
                border-radius:0;
            }

            .message-content{
                max-width:90%;
            }

            .chat-window{
                padding:20px;
            }

            .chat-header{
                padding:18px;
            }
        }

    </style>

</head>

<body>

<div class="chat-container">

    <!-- HEADER -->

    <header class="chat-header">

        <div class="header-left">

            <div class="logo">
                <i data-lucide="sparkles"></i>
            </div>

            <div class="header-text">
                <h1>AI Assistant</h1>
                <p>Powered by Gemini AI</p>
            </div>

        </div>

        <div class="status">
            <div class="status-dot"></div>
            Online
        </div>

    </header>

    <!-- CHAT -->

    <div class="chat-window" id="chatWindow">

        <div class="message-wrapper">

            <div class="avatar bot-avatar">
                <i data-lucide="bot"></i>
            </div>

            <div class="message-content">

                <div class="message bot-message">

                    <h2>Hello 👋</h2>

                    <p>
                        I’m your AI assistant powered by Gemini AI.
                        Ask me anything about coding, projects,
                        DSA, web development, placements, AI,
                        or technology.
                    </p>

                </div>

                <div class="timestamp">
                    Just now
                </div>

            </div>

        </div>

    </div>

    <!-- TYPING -->

    <div class="typing" id="typingIndicator">

        <span>AI is thinking</span>

        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <!-- INPUT -->

    <form class="chat-input-area" id="chatForm">

        <div class="input-container">

            <input
                type="text"
                id="userInput"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button class="send-btn" type="submit">
                <i data-lucide="send"></i>
            </button>

        </div>

    </form>

</div>

<script>

    lucide.createIcons();

    const chatWindow = document.getElementById('chatWindow');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');

    function getTime() {

        return new Date().toLocaleTimeString([], {
            hour:'2-digit',
            minute:'2-digit'
        });
    }

    // CHATGPT STYLE RESPONSE FORMATTER

    function formatAIResponse(text){

        marked.setOptions({
            breaks:true
        });

        return marked.parse(text);
    }

    // CREATE MESSAGE

    function createMessage(text,sender){

        const wrapper = document.createElement('div');

        wrapper.classList.add('message-wrapper');

        if(sender === 'user'){
            wrapper.classList.add('user');
        }

        const avatarClass =
            sender === 'user'
            ? 'user-avatar'
            : 'bot-avatar';

        const icon =
            sender === 'user'
            ? 'user'
            : 'bot';

        const messageClass =
            sender === 'user'
            ? 'user-message'
            : 'bot-message';

        wrapper.innerHTML = `

            ${sender !== 'user' ? `
            <div class="avatar ${avatarClass}">
                <i data-lucide="${icon}"></i>
            </div>
            ` : ''}

            <div class="message-content">

                <div class="message ${messageClass}">

                    ${
                        sender === 'bot'
                        ? formatAIResponse(text)
                        : text
                    }

                </div>

                <div class="timestamp">
                    ${getTime()}
                </div>

            </div>

            ${sender === 'user' ? `
            <div class="avatar ${avatarClass}">
                <i data-lucide="${icon}"></i>
            </div>
            ` : ''}

        `;

        chatWindow.appendChild(wrapper);

        lucide.createIcons();

        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // FETCH AI RESPONSE

    async function fetchAIResponse(message){

        const response = await fetch('/chat',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({
                message:message
            })
        });

        if(!response.ok){
            throw new Error('Server Error');
        }

        const data = await response.json();

        return data.reply;
    }

    // SEND MESSAGE

    chatForm.addEventListener('submit',async(e)=>{

        e.preventDefault();

        const message = userInput.value.trim();

        if(!message) return;

        createMessage(message,'user');

        userInput.value = '';

        typingIndicator.style.display = 'flex';

        try{

            const reply = await fetchAIResponse(message);

            createMessage(reply,'bot');

        }
        catch(error){

            createMessage(
                '⚠️ Error connecting to server. Please check your backend or API key.',
                'bot'
            );
        }
        finally{

            typingIndicator.style.display = 'none';
        }
    });

</script>

</body>
</html>
